<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Conhecimento: Bio, Qui e Geo</title>
    <style>
        :root {
            --bio-color: #2d6a4f;
            --qui-color: #0077b6;
            --geo-color: #bc6c25;
            --text-dark: #2b2d42;
            --bg-gray: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #edf2f4;
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* Título Centralizado */
        header {
            background: white;
            padding: 60px 20px;
            text-align: center;
            border-bottom: 5px solid #d9d9d9;
        }

        header h1 {
            margin: 0;
            font-size: 3rem;
            color: #1a1a1a;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        header p {
            color: #666;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        /* Container Principal com 3 Colunas */
        .main-content {
            display: flex;
            max-width: 1400px;
            margin: 40px auto;
            background: white;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        .column {
            flex: 1;
            padding: 40px;
            /* Linhas verticais separadoras */
            border-right: 1px solid #eee;
            display: flex;
            flex-direction: column;
        }

        .column:last-child {
            border-right: none;
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Estilização por matéria */
        .bio-col h2 { color: var(--bio-color); }
        .qui-col h2 { color: var(--qui-color); }
        .geo-col h2 { color: var(--geo-color); }

        .intro-text {
            font-size: 1rem;
            text-align: justify;
            margin-bottom: 30px;
            color: #4a4a4a;
        }

        .study-box {
            background: var(--bg-gray);
            padding: 20px;
            border-radius: 10px;
            flex-grow: 1;
        }

        .study-box h3 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin-bottom: 12px;
            font-weight: 500;
        }

        /* Rodapé */
        footer {
            background: #1a1a1a;
            color: #8d99ae;
            text-align: center;
            padding: 40px 20px;
            margin-top: 50px;
        }

        footer strong {
            color: white;
        }

        /* Ajuste para dispositivos móveis */
        @media (max-width: 992px) {
            .main-content {
                flex-direction: column;
            }
            .column {
                border-right: none;
                border-bottom: 1px solid #eee;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Portal das Ciências Naturais</h1>
        <p>Explore os fundamentos que explicam a vida, a matéria e o nosso planeta.</p>
    </header>

    <main class="main-content">
        
        <section class="column bio-col">
            <h2>🌿 Biologia</h2>
            <div class="intro-text">
